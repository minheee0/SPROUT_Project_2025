plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 특정 라이브러리의 하위 의존성 충돌을 방지하기 위한 설정
configurations.all {
    exclude group: "org.apache.httpcomponents", module: "httpclient"
}

dependencies {
    // =========================================================
    // ✅ Spring Boot Starters (스프링 부트 핵심 기능)
    // =========================================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // =========================================================
    // ✅ Database (데이터베이스 관련)
    // =========================================================
    runtimeOnly 'com.mysql:mysql-connector-j'
    // implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    // implementation 'org.hibernate.orm:hibernate-core:6.4.1.Final'

    // =========================================================
    // ✅ JWT (JSON Web Token 관련)
    // =========================================================
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // =========================================================
    // ✅ Utilities & Etc. (유틸리티 및 기타)
    // =========================================================
    implementation 'org.json:json:20210307'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310' // Java 8 날짜/시간 타입(LocalDateTime) 지원

    // =========================================================
    // ✅ Lombok (코드 자동 생성)
    // =========================================================
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // =========================================================
    // ✅ Test (테스트)
    // =========================================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}