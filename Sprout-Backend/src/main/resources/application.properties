# ===================================================================
#  DATABASE CONFIGURATION (RDS)
# ===================================================================
spring.config.activate.on-profile=production
# 실제 주소와 계정 정보는 환경 변수(${...})를 통해 주입받습니다.
spring.datasource.url=${RDS_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
#  JPA/HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.open-in-view=false

# ===================================================================
#  SERVER CONFIGURATION
# ===================================================================
server.port=9090
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request-encoding=true

# ===================================================================
#  SECURITY & JWT CONFIGURATION
# ===================================================================
spring.security.crypto.bcrypt.enabled=true
# JWT 시크릿 키도 환경 변수로 관리합니다.
jwt.secret=${JWT_SECRET_KEY}

# ===================================================================
#  FILE UPLOAD & STATIC RESOURCES
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.enabled=false
spring.web.resources.static-locations=classpath:/static/,file:./images/

# ===================================================================
#  API KEYS & LOGGING
# ===================================================================
# API 키도 노출되지 않도록 변수 처리합니다.
plant.api.key=${PLANT_API_KEY}
debug=true

logging.level.org.springframework=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG